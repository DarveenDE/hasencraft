[common.worldGenerator]
	# Keep the live server responsive: Distant Horizons may import already
	# generated chunks for LOD data, but it must not generate missing terrain in
	# the background. Run intentional, bounded pregeneration separately.
	distantGeneratorMode = "PRE_EXISTING_ONLY"
	enableDistantGeneration = false

[server]
	# Stream-safe server mode: no server-side LOD generation, login sync, or
	# realtime propagation. Clients retain their local/cached distant view while
	# the dedicated server prioritizes TPS.
	realTimeUpdateDistanceRadiusInChunks = 64
	maxSyncOnLoadRequestDistance = 64
	synchronizeOnLoad = false
	maxGenerationRequestDistance = 64
	enableServerGeneration = false
	generationRequestRateLimit = 1
	syncOnLoadRateLimit = 2
	enableRealTimeUpdates = false
	playerBandwidthLimit = 500
	globalBandwidthLimit = 2000

[client.advanced.graphics.experimental]
	ignoredDimensionCsv = "ae2:spatial_storage"
	renderingEngine = "AUTO"
