[common.worldGenerator]
	# Build LOD data only from chunks that already exist. Missing terrain is never
	# generated in the background; use intentional, bounded pregeneration for it.
	distantGeneratorMode = "PRE_EXISTING_ONLY"
	enableDistantGeneration = true

[common.multiThreading]
	# Keep a small, predictable CPU budget for background LOD conversion on the
	# six-vCPU server. This must not compete with the server tick thread.
	numberOfThreads = 1
	threadRunTimeRatio = "0.25"

[server]
	# Stream-safe server mode: existing chunks may be converted locally at the
	# limited common budget and served for normal LOD requests. Missing terrain
	# is never generated; login synchronization and realtime propagation stay off.
	realTimeUpdateDistanceRadiusInChunks = 64
	maxSyncOnLoadRequestDistance = 64
	synchronizeOnLoad = false
	maxGenerationRequestDistance = 64
	enableServerGeneration = false
	generationRequestRateLimit = 1
	syncOnLoadRateLimit = 2
	enableRealTimeUpdates = false
	playerBandwidthLimit = 500
	globalBandwidthLimit = 2000

[client.advanced.graphics.experimental]
	ignoredDimensionCsv = "ae2:spatial_storage"
	renderingEngine = "AUTO"
